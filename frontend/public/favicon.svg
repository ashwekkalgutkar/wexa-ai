<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F0C20" />
      <stop offset="1" stop-color="#1A103C" />
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6C5CE7" />
      <stop offset="1" stop-color="#a29bfe" />
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00F0FF" />
      <stop offset="1" stop-color="#70a1ff" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C5CE7" stop-opacity="0.8" />
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="1" stop-color="#FF2A85" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Network Connection Lines -->
  <g stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="16" y1="44" x2="24" y2="22" />
    <line x1="24" y1="22" x2="44" y2="16" />
    <line x1="44" y1="16" x2="48" y2="38" />
    <line x1="24" y1="22" x2="36" y2="46" />
    <line x1="36" y1="46" x2="48" y2="38" />
  </g>

  <!-- Glowing Graph Nodes (representing 6 Degrees) -->
  <circle cx="16" cy="44" r="4" fill="url(#nodeGrad1)" filter="url(#glow)" />
  <circle cx="24" cy="22" r="5" fill="url(#nodeGrad2)" filter="url(#glow)" />
  <circle cx="44" cy="16" r="4.5" fill="#FF2A85" filter="url(#glow)" />
  <circle cx="36" cy="46" r="5" fill="url(#nodeGrad1)" filter="url(#glow)" />
  <circle cx="48" cy="38" r="4" fill="url(#nodeGrad2)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="6" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="2.5" filter="url(#glow)" />
</svg>
